name: Bug report
description: Something in Shasha does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include sign-in details or links to copyrighted content. Security problems should go through private vulnerability reporting, see SECURITY.md.
  - type: dropdown
    id: release_type
    attributes:
      label: Release type
      description: Which kind of release are you using? Beta is the pre-release channel (Settings, Beta updates).
      options:
        - Beta
        - Stable
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, System, About (for example 1.0.0-beta.6)
      placeholder: 1.0.0-beta.6
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device type
      description: Optional. For example phone, tablet, Android TV, laptop, and the model if you know it.
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and the steps to make it happen again.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you thought would happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images or screen recordings into this box.
    validations:
      required: false
